<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外部力を受けるバネ・マス・ダンパ系</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #000;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background: #fff;
            border: 1px solid #000;
        }
        .controls {
            background: #fff;
            padding: 20px;
            border: 1px solid #000;
            min-width: 250px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #000;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value {
            text-align: right;
            font-size: 0.9em;
            color: #666;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #eee;
        }
        .equation {
            border: 1px solid #000;
            padding: 10px;
            margin-top: 15px;
            font-size: 0.9em;
            text-align: center;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>外部力を受けるバネ・マス・ダンパ系</h1>

    <div class="container">
        <div class="graph-container">
            <canvas id="animCanvas" width="450" height="200"></canvas>
            <canvas id="graphCanvas" width="450" height="250"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>質量 m (kg)</label>
                <input type="range" id="mass" min="0.5" max="5" step="0.1" value="1">
                <div class="value" id="massValue">1.0 kg</div>
            </div>

            <div class="control-group">
                <label>バネ定数 k (N/m)</label>
                <input type="range" id="spring" min="10" max="100" step="5" value="30">
                <div class="value" id="springValue">30 N/m</div>
            </div>

            <div class="control-group">
                <label>減衰係数 c (Ns/m)</label>
                <input type="range" id="damper" min="0" max="10" step="0.5" value="2">
                <div class="value" id="damperValue">2.0 Ns/m</div>
            </div>

            <div class="control-group">
                <label>力の振幅 F₀ (N)</label>
                <input type="range" id="forceAmp" min="0" max="20" step="1" value="10">
                <div class="value" id="forceAmpValue">10 N</div>
            </div>

            <div class="control-group">
                <label>力の周波数 f (Hz)</label>
                <input type="range" id="forceFreq" min="0.1" max="3" step="0.1" value="0.5">
                <div class="value" id="forceFreqValue">0.5 Hz</div>
            </div>

            <div class="control-group">
                <label>外部力タイプ</label>
                <select id="forceType" style="width:100%; padding:5px;">
                    <option value="sine">正弦波</option>
                    <option value="step">ステップ</option>
                    <option value="impulse">インパルス</option>
                    <option value="square">矩形波</option>
                </select>
            </div>

            <button id="resetBtn">リセット</button>
            <button id="pauseBtn">一時停止</button>

            <div class="equation">
                <strong>運動方程式:</strong><br>
                m·ẍ + c·ẋ + k·x = F(t)
            </div>

            <div class="equation" id="dampingInfo">
                減衰比 ζ = --
            </div>
        </div>
    </div>

    <script>
        // キャンバス設定
        const animCanvas = document.getElementById('animCanvas');
        const animCtx = animCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // パラメータ
        let m = 1.0;
        let k = 30;
        let c = 2.0;
        let F0 = 10;
        let freq = 0.5;
        let forceType = 'sine';

        // 状態変数
        let x = 0;
        let xDot = 0;
        let t = 0;
        let paused = false;
        let history = [];
        const maxHistory = 600;

        // 外部力関数
        function getForce(time) {
            const omega = 2 * Math.PI * freq;
            switch(forceType) {
                case 'sine':
                    return F0 * Math.sin(omega * time);
                case 'step':
                    return (time > 0.5) ? F0 : 0;
                case 'impulse':
                    return (time < 0.1) ? F0 * Math.exp(-time * 30) * 30 : 0;
                case 'square':
                    return F0 * Math.sign(Math.sin(omega * time));
                default:
                    return 0;
            }
        }

        // UI要素
        document.getElementById('mass').addEventListener('input', (e) => {
            m = parseFloat(e.target.value);
            document.getElementById('massValue').textContent = m.toFixed(1) + ' kg';
            updateDampingInfo();
        });

        document.getElementById('spring').addEventListener('input', (e) => {
            k = parseFloat(e.target.value);
            document.getElementById('springValue').textContent = k + ' N/m';
            updateDampingInfo();
        });

        document.getElementById('damper').addEventListener('input', (e) => {
            c = parseFloat(e.target.value);
            document.getElementById('damperValue').textContent = c.toFixed(1) + ' Ns/m';
            updateDampingInfo();
        });

        document.getElementById('forceAmp').addEventListener('input', (e) => {
            F0 = parseFloat(e.target.value);
            document.getElementById('forceAmpValue').textContent = F0 + ' N';
        });

        document.getElementById('forceFreq').addEventListener('input', (e) => {
            freq = parseFloat(e.target.value);
            document.getElementById('forceFreqValue').textContent = freq.toFixed(1) + ' Hz';
            updateDampingInfo();
        });

        document.getElementById('forceType').addEventListener('change', (e) => {
            forceType = e.target.value;
        });

        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('pauseBtn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? '再開' : '一時停止';
        });

        function updateDampingInfo() {
            const omegaN = Math.sqrt(k / m);
            const zeta = c / (2 * Math.sqrt(k * m));
            const fN = omegaN / (2 * Math.PI);
            const r = freq / fN;

            let status = '';
            if (zeta < 1) status = '不足減衰';
            else if (zeta === 1) status = '臨界減衰';
            else status = '過減衰';

            document.getElementById('dampingInfo').innerHTML =
                `減衰比 ζ = ${zeta.toFixed(2)} (${status})<br>` +
                `固有振動数 f_n = ${fN.toFixed(2)} Hz<br>` +
                `周波数比 r = ${r.toFixed(2)}`;
        }

        function reset() {
            x = 0;
            xDot = 0;
            t = 0;
            history = [];
            paused = false;
            document.getElementById('pauseBtn').textContent = '一時停止';
            updateDampingInfo();
        }

        // 物理シミュレーション (Runge-Kutta 4次)
        function simulate(dt) {
            const F = getForce(t);

            function f(x, xDot) {
                return (F - c * xDot - k * x) / m;
            }

            const k1x = xDot;
            const k1v = f(x, xDot);

            const k2x = xDot + k1v * dt/2;
            const k2v = f(x + k1x * dt/2, xDot + k1v * dt/2);

            const k3x = xDot + k2v * dt/2;
            const k3v = f(x + k2x * dt/2, xDot + k2v * dt/2);

            const k4x = xDot + k3v * dt;
            const k4v = f(x + k3x * dt, xDot + k3v * dt);

            x += (k1x + 2*k2x + 2*k3x + k4x) * dt / 6;
            xDot += (k1v + 2*k2v + 2*k3v + k4v) * dt / 6;

            t += dt;

            history.push({ t: t, x: x, F: F });
            if (history.length > maxHistory) history.shift();
        }

        // バネを描画
        function drawSpring(ctx, x1, y1, x2, y2, coils) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 10) return;
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.translate(x1, y1);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(0, 0);

            const segLen = len / (coils * 2 + 2);
            const amplitude = 12;

            ctx.lineTo(segLen, 0);

            for (let i = 0; i < coils * 2; i++) {
                const xPos = segLen + (i + 1) * segLen;
                const yPos = (i % 2 === 0) ? amplitude : -amplitude;
                ctx.lineTo(xPos, yPos);
            }

            ctx.lineTo(len, 0);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        // ダンパを描画
        function drawDamper(ctx, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.translate(x1, y1);
            ctx.rotate(angle);

            const cylHeight = 18;
            const cylStart = len * 0.2;
            const cylLen = len * 0.4;

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(cylStart, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cylStart, -cylHeight/2);
            ctx.lineTo(cylStart, cylHeight/2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cylStart, -cylHeight/2);
            ctx.lineTo(cylStart + cylLen, -cylHeight/2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cylStart, cylHeight/2);
            ctx.lineTo(cylStart + cylLen, cylHeight/2);
            ctx.stroke();

            const pistonX = len * 0.7;
            ctx.beginPath();
            ctx.moveTo(pistonX, -cylHeight/2 + 2);
            ctx.lineTo(pistonX, cylHeight/2 - 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(pistonX, 0);
            ctx.lineTo(len, 0);
            ctx.stroke();

            ctx.restore();
        }

        // アニメーション描画
        function drawAnimation() {
            animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);

            const scale = 100;
            const wallX = 50;
            const centerY = 100;
            const massRestX = 200;
            const massX = massRestX + x * scale;
            const massSize = 50;

            // 壁
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 2;
            animCtx.beginPath();
            animCtx.moveTo(wallX, centerY - 60);
            animCtx.lineTo(wallX, centerY + 60);
            animCtx.stroke();

            // ハッチング
            animCtx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                animCtx.beginPath();
                animCtx.moveTo(wallX, centerY - 60 + i * 20);
                animCtx.lineTo(wallX - 10, centerY - 50 + i * 20);
                animCtx.stroke();
            }

            // バネ
            drawSpring(animCtx, wallX, centerY - 25, massX - massSize/2, centerY - 25, 8);
            animCtx.fillStyle = '#000';
            animCtx.font = '14px Arial';
            animCtx.fillText('k', (wallX + massX - massSize/2) / 2, centerY - 45);

            // ダンパ
            drawDamper(animCtx, wallX, centerY + 25, massX - massSize/2, centerY + 25);
            animCtx.fillText('c', (wallX + massX - massSize/2) / 2, centerY + 55);

            // 質量
            animCtx.fillStyle = '#bbb';
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.fillRect(massX - massSize/2, centerY - massSize/2, massSize, massSize);
            animCtx.strokeRect(massX - massSize/2, centerY - massSize/2, massSize, massSize);
            animCtx.fillStyle = '#000';
            animCtx.textAlign = 'center';
            animCtx.fillText('m', massX, centerY + 5);

            // 外部力 F(t) 矢印
            const F = getForce(t);
            const forceScale = 2;
            const forceLen = Math.abs(F) * forceScale;
            if (forceLen > 5) {
                animCtx.strokeStyle = '#000';
                animCtx.lineWidth = 2;
                const startX = massX + massSize/2;
                const endX = startX + forceLen * Math.sign(F);
                animCtx.beginPath();
                animCtx.moveTo(startX, centerY);
                animCtx.lineTo(endX, centerY);
                animCtx.stroke();
                // 矢印
                const dir = Math.sign(F);
                animCtx.beginPath();
                animCtx.moveTo(endX - 8 * dir, centerY - 5);
                animCtx.lineTo(endX, centerY);
                animCtx.lineTo(endX - 8 * dir, centerY + 5);
                animCtx.stroke();
                animCtx.textAlign = 'left';
                animCtx.fillText('F(t)', endX + 5 * dir, centerY + 5);
            } else {
                animCtx.textAlign = 'left';
                animCtx.fillText('F(t)', massX + massSize/2 + 10, centerY + 5);
            }

            // 変位 x の表示
            animCtx.strokeStyle = '#666';
            animCtx.setLineDash([3, 3]);
            animCtx.lineWidth = 1;
            animCtx.beginPath();
            animCtx.moveTo(massRestX, centerY - 70);
            animCtx.lineTo(massRestX, centerY - 50);
            animCtx.stroke();
            animCtx.setLineDash([]);

            // x 矢印
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.beginPath();
            animCtx.moveTo(massRestX, centerY - 60);
            animCtx.lineTo(massX, centerY - 60);
            animCtx.stroke();
            if (Math.abs(x) > 0.01) {
                const dir = Math.sign(x);
                animCtx.beginPath();
                animCtx.moveTo(massX - 5 * dir, centerY - 65);
                animCtx.lineTo(massX, centerY - 60);
                animCtx.lineTo(massX - 5 * dir, centerY - 55);
                animCtx.stroke();
            }
            animCtx.textAlign = 'center';
            animCtx.fillText('x', (massRestX + massX) / 2, centerY - 70);

            // 状態表示
            animCtx.fillStyle = '#000';
            animCtx.font = '13px Arial';
            animCtx.textAlign = 'left';
            animCtx.fillText(`x = ${x.toFixed(3)} m`, 10, 25);
            animCtx.fillText(`F = ${F.toFixed(2)} N`, 10, 43);
            animCtx.fillText(`t = ${t.toFixed(2)} s`, 10, 61);
        }

        // グラフ描画
        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            const padding = 50;
            const width = graphCanvas.width - padding * 2;
            const height = graphCanvas.height - padding * 2;

            // 軸
            graphCtx.strokeStyle = '#000';
            graphCtx.lineWidth = 1;
            graphCtx.beginPath();
            graphCtx.moveTo(padding, padding);
            graphCtx.lineTo(padding, graphCanvas.height - padding);
            graphCtx.lineTo(graphCanvas.width - padding, graphCanvas.height - padding);
            graphCtx.stroke();

            // 中心線
            graphCtx.setLineDash([3, 3]);
            graphCtx.strokeStyle = '#999';
            graphCtx.beginPath();
            graphCtx.moveTo(padding, padding + height/2);
            graphCtx.lineTo(graphCanvas.width - padding, padding + height/2);
            graphCtx.stroke();
            graphCtx.setLineDash([]);

            // ラベル
            graphCtx.fillStyle = '#000';
            graphCtx.font = '12px Arial';
            graphCtx.textAlign = 'center';
            graphCtx.fillText('時間 t (s)', graphCanvas.width/2, graphCanvas.height - 5);

            // 履歴描画
            if (history.length > 1) {
                const tMax = Math.max(history[history.length-1].t, 5);
                const xMax = Math.max(0.5, F0 / k * 2);
                const FMax = F0 * 1.2;

                // x（実線）
                graphCtx.strokeStyle = '#000';
                graphCtx.lineWidth = 1.5;
                graphCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const px = padding + (history[i].t / tMax) * width;
                    const py = padding + height/2 - (history[i].x / xMax) * (height/2);
                    if (i === 0) graphCtx.moveTo(px, py);
                    else graphCtx.lineTo(px, py);
                }
                graphCtx.stroke();

                // F（点線、スケール調整）
                graphCtx.strokeStyle = '#999';
                graphCtx.setLineDash([5, 5]);
                graphCtx.lineWidth = 1;
                graphCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const px = padding + (history[i].t / tMax) * width;
                    const py = padding + height/2 - (history[i].F / FMax) * (height/4);
                    if (i === 0) graphCtx.moveTo(px, py);
                    else graphCtx.lineTo(px, py);
                }
                graphCtx.stroke();
                graphCtx.setLineDash([]);
            }

            // 凡例
            graphCtx.font = '11px Arial';
            graphCtx.textAlign = 'left';
            graphCtx.strokeStyle = '#000';
            graphCtx.lineWidth = 1.5;
            graphCtx.beginPath();
            graphCtx.moveTo(graphCanvas.width - 100, 18);
            graphCtx.lineTo(graphCanvas.width - 70, 18);
            graphCtx.stroke();
            graphCtx.fillStyle = '#000';
            graphCtx.fillText('x (m)', graphCanvas.width - 65, 22);

            graphCtx.strokeStyle = '#999';
            graphCtx.setLineDash([5, 5]);
            graphCtx.lineWidth = 1;
            graphCtx.beginPath();
            graphCtx.moveTo(graphCanvas.width - 100, 33);
            graphCtx.lineTo(graphCanvas.width - 70, 33);
            graphCtx.stroke();
            graphCtx.setLineDash([]);
            graphCtx.fillStyle = '#999';
            graphCtx.fillText('F (N)', graphCanvas.width - 65, 37);
        }

        // メインループ
        function animate() {
            if (!paused) {
                simulate(0.016);
            }
            drawAnimation();
            drawGraph();
            requestAnimationFrame(animate);
        }

        // 初期化
        updateDampingInfo();
        reset();
        animate();
    </script>
</body>
</html>
