<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多要素振動系シミュレーション</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #000;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background: #fff;
            border: 1px solid #000;
        }
        .controls {
            background: #fff;
            padding: 15px;
            border: 1px solid #000;
            min-width: 240px;
            max-height: 480px;
            overflow-y: auto;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 3px;
            color: #000;
            font-size: 0.85em;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value {
            text-align: right;
            font-size: 0.8em;
            color: #666;
        }
        button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 0.9em;
        }
        button:hover {
            background: #eee;
        }
        .stats {
            border: 1px solid #000;
            padding: 8px;
            margin-top: 8px;
            font-size: 0.85em;
        }
        .equation {
            border: 1px solid #000;
            padding: 8px;
            margin-top: 8px;
            font-size: 0.75em;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>多要素振動系</h1>

    <div class="container">
        <canvas id="animCanvas" width="550" height="260"></canvas>

        <div class="controls">
            <div class="control-group">
                <label>質量 m (kg)</label>
                <input type="range" id="mass" min="0.5" max="5" step="0.1" value="2">
                <div class="value" id="massValue">2.0 kg</div>
            </div>

            <div class="control-group">
                <label>左ばね k (N/m)</label>
                <input type="range" id="springK" min="50" max="300" step="10" value="120">
                <div class="value" id="springKValue">120 N/m</div>
            </div>

            <div class="control-group">
                <label>左ダンパ c (Ns/m)</label>
                <input type="range" id="damperC" min="0" max="20" step="1" value="5">
                <div class="value" id="damperCValue">5 Ns/m</div>
            </div>

            <div class="control-group">
                <label>右ばね ξ (N/m)</label>
                <input type="range" id="springXi" min="50" max="300" step="10" value="100">
                <div class="value" id="springXiValue">100 N/m</div>
            </div>

            <div class="control-group">
                <label>右ダンパ η (Ns/m)</label>
                <input type="range" id="damperEta" min="0" max="20" step="1" value="4">
                <div class="value" id="damperEtaValue">4 Ns/m</div>
            </div>

            <div class="control-group">
                <label>接地ばね kT (N/m)</label>
                <input type="range" id="springT" min="0" max="150" step="10" value="50">
                <div class="value" id="springTValue">50 N/m</div>
            </div>

            <div class="control-group">
                <label>摩擦係数 μ</label>
                <input type="range" id="friction" min="0" max="0.3" step="0.02" value="0.1">
                <div class="value" id="frictionValue">0.10</div>
            </div>

            <div class="control-group">
                <label>外力振幅 F₀ (N)</label>
                <input type="range" id="forceAmp" min="0" max="50" step="2" value="25">
                <div class="value" id="forceAmpValue">25 N</div>
            </div>

            <div class="control-group">
                <label>外力周波数 (Hz)</label>
                <input type="range" id="forceFreq" min="0.5" max="5" step="0.1" value="1.5">
                <div class="value" id="forceFreqValue">1.5 Hz</div>
            </div>

            <button id="resetBtn">リセット</button>
            <button id="pauseBtn">一時停止</button>

            <div class="stats" id="stats">
                変位: 0.00 cm<br>
                速度: 0.00 m/s
            </div>

            <div class="equation">
                <strong>運動方程式:</strong><br>
                mẍ + (c+η)ẋ + (k+ξ+kT)x<br>
                + μ·FN·sign(ẋ) = F(t)
            </div>
        </div>

        <div class="graph-container">
            <canvas id="graphCanvas" width="450" height="200"></canvas>
        </div>
    </div>

    <script>
        // キャンバス設定
        const animCanvas = document.getElementById('animCanvas');
        const animCtx = animCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // パラメータ
        let m = 2.0;           // 質量
        let k = 120;           // 左ばね
        let c = 5;             // 左ダンパ
        let xi = 100;          // 右ばね
        let eta = 4;           // 右ダンパ
        let kT = 50;           // 接地ばね
        let mu = 0.1;          // 摩擦係数
        let F0 = 25;           // 外力振幅
        let fFreq = 1.5;       // 外力周波数

        const g = 9.81;

        // 状態変数
        let x = 0;             // 位置
        let v = 0;             // 速度
        let t = 0;
        let paused = false;

        // グラフデータ
        let history = [];
        const maxHistory = 500;

        // UI要素
        document.getElementById('mass').addEventListener('input', (ev) => {
            m = parseFloat(ev.target.value);
            document.getElementById('massValue').textContent = m.toFixed(1) + ' kg';
        });

        document.getElementById('springK').addEventListener('input', (ev) => {
            k = parseFloat(ev.target.value);
            document.getElementById('springKValue').textContent = k.toFixed(0) + ' N/m';
        });

        document.getElementById('damperC').addEventListener('input', (ev) => {
            c = parseFloat(ev.target.value);
            document.getElementById('damperCValue').textContent = c.toFixed(0) + ' Ns/m';
        });

        document.getElementById('springXi').addEventListener('input', (ev) => {
            xi = parseFloat(ev.target.value);
            document.getElementById('springXiValue').textContent = xi.toFixed(0) + ' N/m';
        });

        document.getElementById('damperEta').addEventListener('input', (ev) => {
            eta = parseFloat(ev.target.value);
            document.getElementById('damperEtaValue').textContent = eta.toFixed(0) + ' Ns/m';
        });

        document.getElementById('springT').addEventListener('input', (ev) => {
            kT = parseFloat(ev.target.value);
            document.getElementById('springTValue').textContent = kT.toFixed(0) + ' N/m';
        });

        document.getElementById('friction').addEventListener('input', (ev) => {
            mu = parseFloat(ev.target.value);
            document.getElementById('frictionValue').textContent = mu.toFixed(2);
        });

        document.getElementById('forceAmp').addEventListener('input', (ev) => {
            F0 = parseFloat(ev.target.value);
            document.getElementById('forceAmpValue').textContent = F0.toFixed(0) + ' N';
        });

        document.getElementById('forceFreq').addEventListener('input', (ev) => {
            fFreq = parseFloat(ev.target.value);
            document.getElementById('forceFreqValue').textContent = fFreq.toFixed(1) + ' Hz';
        });

        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('pauseBtn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? '再開' : '一時停止';
        });

        function reset() {
            x = 0.03;
            v = 0;
            t = 0;
            history = [];
            paused = false;
            document.getElementById('pauseBtn').textContent = '一時停止';
        }

        // 運動方程式
        function derivatives(state, time) {
            const [x, v] = state;

            // 外力
            const F = F0 * Math.sin(2 * Math.PI * fFreq * time);

            // ばね力
            const Fspring = -(k + xi + kT) * x;

            // ダンパ力
            const Fdamp = -(c + eta) * v;

            // 摩擦力
            const Fn = m * g;
            let Ffriction = 0;
            if (Math.abs(v) > 0.001) {
                Ffriction = -mu * Fn * Math.sign(v);
            }

            const acc = (Fspring + Fdamp + Ffriction + F) / m;

            return [v, acc];
        }

        function rk4Step(state, time, dt) {
            const k1 = derivatives(state, time);
            const k2 = derivatives([
                state[0] + k1[0] * dt / 2,
                state[1] + k1[1] * dt / 2
            ], time + dt / 2);
            const k3 = derivatives([
                state[0] + k2[0] * dt / 2,
                state[1] + k2[1] * dt / 2
            ], time + dt / 2);
            const k4 = derivatives([
                state[0] + k3[0] * dt,
                state[1] + k3[1] * dt
            ], time + dt);

            return [
                state[0] + (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6,
                state[1] + (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6
            ];
        }

        function simulate(dt) {
            const state = rk4Step([x, v], t, dt);
            x = state[0];
            v = state[1];
            t += dt;

            // 履歴保存
            history.push({ t: t, x: x });
            if (history.length > maxHistory) history.shift();

            // 統計更新
            document.getElementById('stats').innerHTML =
                `変位: ${(x * 100).toFixed(2)} cm<br>` +
                `速度: ${v.toFixed(3)} m/s`;
        }

        function drawSpring(x1, y1, x2, y2, coils) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 15) return;

            const ux = dx / len;
            const uy = dy / len;
            const px = -uy;
            const py = ux;

            const coilWidth = 8;
            const endLen = 6;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            animCtx.lineTo(x1 + ux * endLen, y1 + uy * endLen);

            const coilLen = (len - 2 * endLen) / coils;
            for (let i = 0; i < coils; i++) {
                const startX = x1 + ux * (endLen + i * coilLen);
                const startY = y1 + uy * (endLen + i * coilLen);

                animCtx.lineTo(startX + ux * coilLen * 0.25 + px * coilWidth,
                              startY + uy * coilLen * 0.25 + py * coilWidth);
                animCtx.lineTo(startX + ux * coilLen * 0.75 - px * coilWidth,
                              startY + uy * coilLen * 0.75 - py * coilWidth);
            }

            animCtx.lineTo(x2 - ux * endLen, y2 - uy * endLen);
            animCtx.lineTo(x2, y2);
            animCtx.stroke();
        }

        function drawDamper(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 25) return;

            const ux = dx / len;
            const uy = dy / len;

            const boxWidth = 10;
            const boxLen = 14;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            const midX = (x1 + x2) / 2 - ux * boxLen / 2;
            const midY = (y1 + y2) / 2 - uy * boxLen / 2;
            animCtx.lineTo(midX, midY);
            animCtx.stroke();

            animCtx.save();
            animCtx.translate(midX, midY);
            animCtx.rotate(Math.atan2(dy, dx));
            animCtx.strokeRect(-2, -boxWidth / 2, boxLen, boxWidth);
            animCtx.restore();

            animCtx.beginPath();
            animCtx.moveTo(x2, y2);
            animCtx.lineTo(midX + ux * boxLen, midY + uy * boxLen);
            animCtx.stroke();
        }

        function draw() {
            animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);

            const centerY = 125;
            const scale = 500;
            const baseX = 220;
            const massX = baseX + x * scale;
            const massW = 35;
            const massH = 80;

            const rightWallX = 430;

            // 左壁
            animCtx.fillStyle = '#ddd';
            animCtx.fillRect(40, centerY - 60, 20, 120);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.strokeRect(40, centerY - 60, 20, 120);

            for (let i = 0; i < 12; i++) {
                animCtx.beginPath();
                animCtx.moveTo(40, centerY - 55 + i * 10);
                animCtx.lineTo(30, centerY - 45 + i * 10);
                animCtx.stroke();
            }

            // 右壁
            animCtx.fillStyle = '#ddd';
            animCtx.fillRect(rightWallX, centerY - 60, 20, 120);
            animCtx.strokeRect(rightWallX, centerY - 60, 20, 120);

            for (let i = 0; i < 12; i++) {
                animCtx.beginPath();
                animCtx.moveTo(rightWallX + 20, centerY - 55 + i * 10);
                animCtx.lineTo(rightWallX + 30, centerY - 45 + i * 10);
                animCtx.stroke();
            }

            // 床
            animCtx.fillStyle = '#eee';
            animCtx.fillRect(60, centerY + 60, rightWallX - 40, 15);
            animCtx.strokeRect(60, centerY + 60, rightWallX - 40, 15);

            for (let i = 0; i < 18; i++) {
                animCtx.beginPath();
                animCtx.moveTo(70 + i * 20, centerY + 75);
                animCtx.lineTo(60 + i * 20, centerY + 85);
                animCtx.stroke();
            }

            // ばね・ダンパ描画
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;

            // 左側 k, c
            drawSpring(60, centerY - 20, massX - massW/2, centerY - 20, 6);
            drawDamper(60, centerY + 20, massX - massW/2, centerY + 20);

            // 右側 ξ, η
            drawSpring(massX + massW/2, centerY - 20, rightWallX, centerY - 20, 6);
            drawDamper(massX + massW/2, centerY + 20, rightWallX, centerY + 20);

            // 接地ばね kT
            drawSpring(massX + massW/2 + 40, centerY + 60, massX + massW/2 + 20, centerY + massH/2, 4);

            // 摩擦要素
            animCtx.fillStyle = '#fff';
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.fillRect(massX - 30, centerY + 40, 40, 18);
            animCtx.strokeRect(massX - 30, centerY + 40, 40, 18);

            // 質量
            animCtx.fillStyle = '#aaa';
            animCtx.fillRect(massX - massW/2, centerY - massH/2, massW, massH);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 2;
            animCtx.strokeRect(massX - massW/2, centerY - massH/2, massW, massH);

            // ラベル
            animCtx.fillStyle = '#000';
            animCtx.font = '14px Arial';
            animCtx.textAlign = 'center';
            animCtx.fillText('m', massX, centerY + 5);

            animCtx.font = '12px Arial';
            animCtx.fillText('k', 90, centerY - 35);
            animCtx.fillText('c', 90, centerY + 38);
            animCtx.fillText('ξ', rightWallX - 40, centerY - 35);
            animCtx.fillText('η', rightWallX - 40, centerY + 38);
            animCtx.fillText('ζ', massX - 40, centerY + 52);
            animCtx.fillText('kT', massX + massW/2 + 55, centerY + 55);

            // 外力 F(t)
            const F = F0 * Math.sin(2 * Math.PI * fFreq * t);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 2;

            if (Math.abs(F) > 1) {
                const arrowLen = Math.abs(F) * 1.2;
                animCtx.beginPath();
                if (F < 0) {  // 左向き
                    animCtx.moveTo(massX - massW/2 - 10, centerY);
                    animCtx.lineTo(massX - massW/2 - 10 - arrowLen, centerY);
                    animCtx.moveTo(massX - massW/2 - arrowLen - 2, centerY - 5);
                    animCtx.lineTo(massX - massW/2 - arrowLen - 10, centerY);
                    animCtx.lineTo(massX - massW/2 - arrowLen - 2, centerY + 5);
                } else {  // 右向き
                    animCtx.moveTo(massX - massW/2 - 10 - arrowLen, centerY);
                    animCtx.lineTo(massX - massW/2 - 10, centerY);
                    animCtx.moveTo(massX - massW/2 - 18, centerY - 5);
                    animCtx.lineTo(massX - massW/2 - 10, centerY);
                    animCtx.lineTo(massX - massW/2 - 18, centerY + 5);
                }
                animCtx.stroke();
            }
            animCtx.font = '12px Arial';
            animCtx.textAlign = 'right';
            animCtx.fillText('F(t)', massX - massW/2 - 50, centerY - 15);

            // 変位表示
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.beginPath();
            animCtx.moveTo(baseX, centerY - massH/2 - 20);
            animCtx.lineTo(massX, centerY - massH/2 - 20);
            animCtx.stroke();
            animCtx.textAlign = 'center';
            animCtx.fillText('x', (baseX + massX) / 2, centerY - massH/2 - 30);

            // 垂直抗力
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.beginPath();
            animCtx.moveTo(rightWallX - 50, centerY + 85);
            animCtx.lineTo(rightWallX - 50, centerY + 115);
            animCtx.stroke();
            animCtx.beginPath();
            animCtx.moveTo(rightWallX - 55, centerY + 110);
            animCtx.lineTo(rightWallX - 50, centerY + 115);
            animCtx.lineTo(rightWallX - 45, centerY + 110);
            animCtx.stroke();
            animCtx.font = '11px Arial';
            animCtx.fillText('FN', rightWallX - 50, centerY + 130);

            // 摩擦係数
            animCtx.textAlign = 'left';
            animCtx.fillText('μ', rightWallX - 10, centerY + 100);

            // 重力（紙面垂直）
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.beginPath();
            animCtx.arc(100, 30, 12, 0, Math.PI * 2);
            animCtx.stroke();
            animCtx.beginPath();
            animCtx.moveTo(92, 22);
            animCtx.lineTo(108, 38);
            animCtx.moveTo(92, 38);
            animCtx.lineTo(108, 22);
            animCtx.stroke();
            animCtx.font = '14px Arial';
            animCtx.fillText('g', 115, 35);
        }

        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            // 背景
            graphCtx.fillStyle = '#f9f9f9';
            graphCtx.fillRect(50, 10, 390, 170);

            // グリッド
            graphCtx.strokeStyle = '#ddd';
            graphCtx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = 10 + i * 42.5;
                graphCtx.beginPath();
                graphCtx.moveTo(50, y);
                graphCtx.lineTo(440, y);
                graphCtx.stroke();
            }

            // 軸
            graphCtx.strokeStyle = '#000';
            graphCtx.beginPath();
            graphCtx.moveTo(50, 95);
            graphCtx.lineTo(440, 95);
            graphCtx.stroke();
            graphCtx.beginPath();
            graphCtx.moveTo(50, 10);
            graphCtx.lineTo(50, 180);
            graphCtx.stroke();

            // ラベル
            graphCtx.fillStyle = '#000';
            graphCtx.font = '12px Arial';
            graphCtx.textAlign = 'left';
            graphCtx.fillText('x (m)', 5, 20);
            graphCtx.fillText('t (s)', 415, 195);

            // データプロット
            if (history.length > 1) {
                const tMax = Math.max(history[history.length - 1].t, 5);
                const xMax = 0.06;

                graphCtx.strokeStyle = '#000';
                graphCtx.lineWidth = 1.5;
                graphCtx.beginPath();

                for (let i = 0; i < history.length; i++) {
                    const px = 50 + (history[i].t / tMax) * 390;
                    const py = 95 - (history[i].x / xMax) * 75;

                    if (i === 0) {
                        graphCtx.moveTo(px, py);
                    } else {
                        graphCtx.lineTo(px, py);
                    }
                }
                graphCtx.stroke();
            }
        }

        // メインループ
        function animate() {
            if (!paused) {
                for (let i = 0; i < 5; i++) {
                    simulate(0.016 / 5);
                }
            }
            draw();
            drawGraph();
            requestAnimationFrame(animate);
        }

        // 初期化
        reset();
        animate();
    </script>
</body>
</html>
