<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>両側ばね-ダンパ系シミュレーション</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #000;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background: #fff;
            border: 1px solid #000;
        }
        .controls {
            background: #fff;
            padding: 20px;
            border: 1px solid #000;
            min-width: 250px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 3px;
            color: #000;
            font-size: 0.9em;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value {
            text-align: right;
            font-size: 0.85em;
            color: #666;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #eee;
        }
        .stats {
            border: 1px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .equation {
            border: 1px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.8em;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>両側ばね-ダンパ系</h1>

    <div class="container">
        <canvas id="animCanvas" width="500" height="250"></canvas>

        <div class="controls">
            <div class="control-group">
                <label>質量 m (kg)</label>
                <input type="range" id="mass" min="0.5" max="5" step="0.1" value="2">
                <div class="value" id="massValue">2.0 kg</div>
            </div>

            <div class="control-group">
                <label>左ばね k (N/m)</label>
                <input type="range" id="springK" min="10" max="200" step="5" value="100">
                <div class="value" id="springKValue">100 N/m</div>
            </div>

            <div class="control-group">
                <label>左ダンパ c (Ns/m)</label>
                <input type="range" id="damperC" min="0" max="20" step="1" value="5">
                <div class="value" id="damperCValue">5 Ns/m</div>
            </div>

            <div class="control-group">
                <label>右ばね ξ (N/m)</label>
                <input type="range" id="springXi" min="10" max="200" step="5" value="80">
                <div class="value" id="springXiValue">80 N/m</div>
            </div>

            <div class="control-group">
                <label>右ダンパ η (Ns/m)</label>
                <input type="range" id="damperEta" min="0" max="20" step="1" value="3">
                <div class="value" id="damperEtaValue">3 Ns/m</div>
            </div>

            <div class="control-group">
                <label>摩擦係数 ζ</label>
                <input type="range" id="friction" min="0" max="0.5" step="0.02" value="0.1">
                <div class="value" id="frictionValue">0.10</div>
            </div>

            <div class="control-group">
                <label>外力振幅 F₀ (N)</label>
                <input type="range" id="forceAmp" min="0" max="50" step="2" value="20">
                <div class="value" id="forceAmpValue">20 N</div>
            </div>

            <div class="control-group">
                <label>外力周波数 (Hz)</label>
                <input type="range" id="forceFreq" min="0.5" max="5" step="0.1" value="1">
                <div class="value" id="forceFreqValue">1.0 Hz</div>
            </div>

            <button id="resetBtn">リセット</button>
            <button id="pauseBtn">一時停止</button>

            <div class="stats" id="stats">
                変位: 0.00 m<br>
                速度: 0.00 m/s
            </div>

            <div class="equation">
                <strong>運動方程式:</strong><br>
                mẍ + (c+η)ẋ + (k+ξ)x<br>
                + ζ·m·g·sign(ẋ) = F(t)
            </div>
        </div>

        <div class="graph-container">
            <canvas id="graphCanvas" width="450" height="200"></canvas>
        </div>
    </div>

    <script>
        // キャンバス設定
        const animCanvas = document.getElementById('animCanvas');
        const animCtx = animCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // パラメータ
        let m = 2.0;           // 質量
        let k = 100;           // 左ばね
        let c = 5;             // 左ダンパ
        let xi = 80;           // 右ばね
        let eta = 3;           // 右ダンパ
        let zeta = 0.1;        // 摩擦係数
        let F0 = 20;           // 外力振幅
        let fFreq = 1.0;       // 外力周波数

        const g = 9.81;

        // 状態変数
        let x = 0;             // 位置
        let v = 0;             // 速度
        let t = 0;
        let paused = false;

        // グラフデータ
        let history = [];
        const maxHistory = 500;

        // UI要素
        document.getElementById('mass').addEventListener('input', (ev) => {
            m = parseFloat(ev.target.value);
            document.getElementById('massValue').textContent = m.toFixed(1) + ' kg';
        });

        document.getElementById('springK').addEventListener('input', (ev) => {
            k = parseFloat(ev.target.value);
            document.getElementById('springKValue').textContent = k.toFixed(0) + ' N/m';
        });

        document.getElementById('damperC').addEventListener('input', (ev) => {
            c = parseFloat(ev.target.value);
            document.getElementById('damperCValue').textContent = c.toFixed(0) + ' Ns/m';
        });

        document.getElementById('springXi').addEventListener('input', (ev) => {
            xi = parseFloat(ev.target.value);
            document.getElementById('springXiValue').textContent = xi.toFixed(0) + ' N/m';
        });

        document.getElementById('damperEta').addEventListener('input', (ev) => {
            eta = parseFloat(ev.target.value);
            document.getElementById('damperEtaValue').textContent = eta.toFixed(0) + ' Ns/m';
        });

        document.getElementById('friction').addEventListener('input', (ev) => {
            zeta = parseFloat(ev.target.value);
            document.getElementById('frictionValue').textContent = zeta.toFixed(2);
        });

        document.getElementById('forceAmp').addEventListener('input', (ev) => {
            F0 = parseFloat(ev.target.value);
            document.getElementById('forceAmpValue').textContent = F0.toFixed(0) + ' N';
        });

        document.getElementById('forceFreq').addEventListener('input', (ev) => {
            fFreq = parseFloat(ev.target.value);
            document.getElementById('forceFreqValue').textContent = fFreq.toFixed(1) + ' Hz';
        });

        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('pauseBtn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? '再開' : '一時停止';
        });

        function reset() {
            x = 0.03;  // 初期変位
            v = 0;
            t = 0;
            history = [];
            paused = false;
            document.getElementById('pauseBtn').textContent = '一時停止';
        }

        // 運動方程式
        function derivatives(state, time) {
            const [x, v] = state;

            // 外力
            const F = F0 * Math.sin(2 * Math.PI * fFreq * time);

            // ばね力
            const Fspring = -(k + xi) * x;

            // ダンパ力
            const Fdamp = -(c + eta) * v;

            // クーロン摩擦
            const Fn = m * g;  // 垂直抗力
            let Ffriction = 0;
            if (Math.abs(v) > 0.001) {
                Ffriction = -zeta * Fn * Math.sign(v);
            } else {
                // 静止摩擦（簡略化）
                const Fnet = Fspring + Fdamp + F;
                if (Math.abs(Fnet) < zeta * Fn) {
                    Ffriction = -Fnet;  // 静止
                } else {
                    Ffriction = -zeta * Fn * Math.sign(Fnet);
                }
            }

            const acc = (Fspring + Fdamp + Ffriction + F) / m;

            return [v, acc];
        }

        function rk4Step(state, time, dt) {
            const k1 = derivatives(state, time);
            const k2 = derivatives([
                state[0] + k1[0] * dt / 2,
                state[1] + k1[1] * dt / 2
            ], time + dt / 2);
            const k3 = derivatives([
                state[0] + k2[0] * dt / 2,
                state[1] + k2[1] * dt / 2
            ], time + dt / 2);
            const k4 = derivatives([
                state[0] + k3[0] * dt,
                state[1] + k3[1] * dt
            ], time + dt);

            return [
                state[0] + (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6,
                state[1] + (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6
            ];
        }

        function simulate(dt) {
            const state = rk4Step([x, v], t, dt);
            x = state[0];
            v = state[1];
            t += dt;

            // 履歴保存
            history.push({ t: t, x: x });
            if (history.length > maxHistory) history.shift();

            // 統計更新
            document.getElementById('stats').innerHTML =
                `変位: ${(x * 100).toFixed(2)} cm<br>` +
                `速度: ${v.toFixed(3)} m/s`;
        }

        function drawSpring(x1, y1, x2, y2, coils) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 20) return;

            const ux = dx / len;
            const uy = dy / len;
            const px = -uy;
            const py = ux;

            const coilWidth = 8;
            const endLen = 8;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            animCtx.lineTo(x1 + ux * endLen, y1 + uy * endLen);

            const coilLen = (len - 2 * endLen) / coils;
            for (let i = 0; i < coils; i++) {
                const startX = x1 + ux * (endLen + i * coilLen);
                const startY = y1 + uy * (endLen + i * coilLen);

                animCtx.lineTo(startX + ux * coilLen * 0.25 + px * coilWidth,
                              startY + uy * coilLen * 0.25 + py * coilWidth);
                animCtx.lineTo(startX + ux * coilLen * 0.75 - px * coilWidth,
                              startY + uy * coilLen * 0.75 - py * coilWidth);
            }

            animCtx.lineTo(x2 - ux * endLen, y2 - uy * endLen);
            animCtx.lineTo(x2, y2);
            animCtx.stroke();
        }

        function drawDamper(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 30) return;

            const ux = dx / len;
            const uy = dy / len;
            const px = -uy;
            const py = ux;

            const boxWidth = 12;
            const boxLen = 18;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            const midX = (x1 + x2) / 2 - ux * boxLen / 2;
            const midY = (y1 + y2) / 2 - uy * boxLen / 2;
            animCtx.lineTo(midX, midY);
            animCtx.stroke();

            // ダンパボックス
            animCtx.save();
            animCtx.translate(midX, midY);
            animCtx.rotate(Math.atan2(dy, dx));
            animCtx.strokeRect(-2, -boxWidth / 2, boxLen, boxWidth);
            animCtx.restore();

            // ピストン
            animCtx.beginPath();
            animCtx.moveTo(x2, y2);
            animCtx.lineTo(midX + ux * boxLen, midY + uy * boxLen);
            animCtx.stroke();
        }

        function draw() {
            animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);

            const centerY = 125;
            const scale = 500;
            const massX = 250 + x * scale;
            const massWidth = 30;
            const massHeight = 80;

            // 左壁
            animCtx.fillStyle = '#ddd';
            animCtx.fillRect(40, centerY - 60, 20, 120);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.strokeRect(40, centerY - 60, 20, 120);

            // 左壁ハッチング
            for (let i = 0; i < 12; i++) {
                animCtx.beginPath();
                animCtx.moveTo(40, centerY - 55 + i * 10);
                animCtx.lineTo(30, centerY - 45 + i * 10);
                animCtx.stroke();
            }

            // 右壁
            animCtx.fillStyle = '#ddd';
            animCtx.fillRect(440, centerY - 60, 20, 120);
            animCtx.strokeRect(440, centerY - 60, 20, 120);

            // 右壁ハッチング
            for (let i = 0; i < 12; i++) {
                animCtx.beginPath();
                animCtx.moveTo(460, centerY - 55 + i * 10);
                animCtx.lineTo(470, centerY - 45 + i * 10);
                animCtx.stroke();
            }

            // 床（摩擦面）
            animCtx.fillStyle = '#eee';
            animCtx.fillRect(60, centerY + 50, 380, 15);
            animCtx.strokeRect(60, centerY + 50, 380, 15);

            // 床ハッチング
            for (let i = 0; i < 19; i++) {
                animCtx.beginPath();
                animCtx.moveTo(70 + i * 20, centerY + 65);
                animCtx.lineTo(60 + i * 20, centerY + 75);
                animCtx.stroke();
            }

            // 左側のばね・ダンパ
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            drawSpring(60, centerY - 25, massX - massWidth/2, centerY - 25, 6);
            drawDamper(60, centerY + 25, massX - massWidth/2, centerY + 25);

            // 右側のばね・ダンパ
            drawSpring(massX + massWidth/2, centerY - 25, 440, centerY - 25, 6);
            drawDamper(massX + massWidth/2, centerY + 25, 440, centerY + 25);

            // 質量 m
            animCtx.fillStyle = '#aaa';
            animCtx.fillRect(massX - massWidth/2, centerY - massHeight/2, massWidth, massHeight);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 2;
            animCtx.strokeRect(massX - massWidth/2, centerY - massHeight/2, massWidth, massHeight);

            // 質量ラベル
            animCtx.fillStyle = '#000';
            animCtx.font = '16px Arial';
            animCtx.textAlign = 'center';
            animCtx.fillText('m', massX, centerY + 5);

            // ばね・ダンパラベル
            animCtx.font = '14px Arial';
            animCtx.fillText('k', 100, centerY - 40);
            animCtx.fillText('c', 100, centerY + 45);
            animCtx.fillText('ξ', 400, centerY - 40);
            animCtx.fillText('η', 400, centerY + 45);

            // 摩擦要素ラベル
            animCtx.fillText('ζ', 80, centerY + 80);

            // 外力 F(t) の矢印
            const F = F0 * Math.sin(2 * Math.PI * fFreq * t);
            if (Math.abs(F) > 1) {
                animCtx.strokeStyle = '#000';
                animCtx.lineWidth = 2;
                const arrowLen = Math.abs(F) * 1.5;
                const arrowX = massX - massWidth/2 - 10;

                animCtx.beginPath();
                if (F > 0) {
                    animCtx.moveTo(arrowX - arrowLen, centerY);
                    animCtx.lineTo(arrowX, centerY);
                    // 矢印の先
                    animCtx.moveTo(arrowX - 8, centerY - 5);
                    animCtx.lineTo(arrowX, centerY);
                    animCtx.lineTo(arrowX - 8, centerY + 5);
                } else {
                    animCtx.moveTo(arrowX, centerY);
                    animCtx.lineTo(arrowX + arrowLen, centerY);
                    animCtx.moveTo(arrowX + 8, centerY - 5);
                    animCtx.lineTo(arrowX, centerY);
                    animCtx.lineTo(arrowX + 8, centerY + 5);
                }
                animCtx.stroke();
            }
            animCtx.font = '12px Arial';
            animCtx.fillText('F(t)', massX - massWidth/2 - 40, centerY - 15);

            // 変位表示
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.beginPath();
            animCtx.moveTo(250, centerY - massHeight/2 - 20);
            animCtx.lineTo(massX, centerY - massHeight/2 - 20);
            animCtx.stroke();

            if (Math.abs(x) > 0.005) {
                const arrowDir = x > 0 ? 1 : -1;
                animCtx.beginPath();
                animCtx.moveTo(massX - arrowDir * 8, centerY - massHeight/2 - 25);
                animCtx.lineTo(massX, centerY - massHeight/2 - 20);
                animCtx.lineTo(massX - arrowDir * 8, centerY - massHeight/2 - 15);
                animCtx.stroke();
            }
            animCtx.fillText('x', (250 + massX) / 2, centerY - massHeight/2 - 30);

            // 重力（紙面垂直）
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.beginPath();
            animCtx.arc(80, 30, 12, 0, Math.PI * 2);
            animCtx.stroke();
            animCtx.beginPath();
            animCtx.moveTo(72, 22);
            animCtx.lineTo(88, 38);
            animCtx.moveTo(72, 38);
            animCtx.lineTo(88, 22);
            animCtx.stroke();
            animCtx.font = '14px Arial';
            animCtx.textAlign = 'left';
            animCtx.fillText('g', 95, 35);
        }

        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            // 背景
            graphCtx.fillStyle = '#f9f9f9';
            graphCtx.fillRect(50, 10, 390, 170);

            // グリッド
            graphCtx.strokeStyle = '#ddd';
            graphCtx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = 10 + i * 42.5;
                graphCtx.beginPath();
                graphCtx.moveTo(50, y);
                graphCtx.lineTo(440, y);
                graphCtx.stroke();
            }

            // 軸
            graphCtx.strokeStyle = '#000';
            graphCtx.beginPath();
            graphCtx.moveTo(50, 95);
            graphCtx.lineTo(440, 95);
            graphCtx.stroke();
            graphCtx.beginPath();
            graphCtx.moveTo(50, 10);
            graphCtx.lineTo(50, 180);
            graphCtx.stroke();

            // ラベル
            graphCtx.fillStyle = '#000';
            graphCtx.font = '12px Arial';
            graphCtx.textAlign = 'left';
            graphCtx.fillText('x (m)', 5, 20);
            graphCtx.fillText('t (s)', 415, 195);

            // データプロット
            if (history.length > 1) {
                const tMax = Math.max(history[history.length - 1].t, 5);
                const xMax = 0.1;

                graphCtx.strokeStyle = '#000';
                graphCtx.lineWidth = 1.5;
                graphCtx.beginPath();

                for (let i = 0; i < history.length; i++) {
                    const px = 50 + (history[i].t / tMax) * 390;
                    const py = 95 - (history[i].x / xMax) * 75;

                    if (i === 0) {
                        graphCtx.moveTo(px, py);
                    } else {
                        graphCtx.lineTo(px, py);
                    }
                }
                graphCtx.stroke();
            }
        }

        // メインループ
        function animate() {
            if (!paused) {
                for (let i = 0; i < 5; i++) {
                    simulate(0.016 / 5);
                }
            }
            draw();
            drawGraph();
            requestAnimationFrame(animate);
        }

        // 初期化
        reset();
        animate();
    </script>
</body>
</html>
