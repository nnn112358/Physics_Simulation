<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>振り子衝突シミュレーション</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #000;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background: #fff;
            border: 1px solid #000;
        }
        .controls {
            background: #fff;
            padding: 20px;
            border: 1px solid #000;
            min-width: 250px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #000;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value {
            text-align: right;
            font-size: 0.9em;
            color: #666;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #eee;
        }
        .stats {
            border: 1px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .equation {
            border: 1px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.85em;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>振り子衝突シミュレーション</h1>

    <div class="container">
        <canvas id="animCanvas" width="550" height="350"></canvas>

        <div class="controls">
            <div class="control-group">
                <label>振り子の質量 m₁ (kg)</label>
                <input type="range" id="mass1" min="0.5" max="5" step="0.1" value="2">
                <div class="value" id="mass1Value">2.0 kg</div>
            </div>

            <div class="control-group">
                <label>スライダー質量 m₂ (kg)</label>
                <input type="range" id="mass2" min="0.5" max="5" step="0.1" value="1">
                <div class="value" id="mass2Value">1.0 kg</div>
            </div>

            <div class="control-group">
                <label>振り子の長さ L (m)</label>
                <input type="range" id="length" min="0.3" max="1" step="0.05" value="0.5">
                <div class="value" id="lengthValue">0.50 m</div>
            </div>

            <div class="control-group">
                <label>初期角度 φ₀ (°)</label>
                <input type="range" id="initAngle" min="30" max="90" step="5" value="60">
                <div class="value" id="initAngleValue">60°</div>
            </div>

            <div class="control-group">
                <label>ばね定数 k (N/m)</label>
                <input type="range" id="spring" min="50" max="500" step="10" value="200">
                <div class="value" id="springValue">200 N/m</div>
            </div>

            <div class="control-group">
                <label>減衰係数 c (Ns/m)</label>
                <input type="range" id="damping" min="0" max="30" step="1" value="10">
                <div class="value" id="dampingValue">10 Ns/m</div>
            </div>

            <div class="control-group">
                <label>反発係数 e</label>
                <input type="range" id="restitution" min="0" max="1" step="0.05" value="0.9">
                <div class="value" id="restitutionValue">0.90</div>
            </div>

            <button id="resetBtn">リセット</button>
            <button id="pauseBtn">一時停止</button>

            <div class="stats" id="stats">
                振り子角度: 60°<br>
                スライダー変位: 0.00 m<br>
                衝突回数: 0
            </div>

            <div class="equation">
                <strong>衝突則:</strong><br>
                m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'<br>
                e = -(v₂'-v₁')/(v₂-v₁)<br>
                μ = 0（摩擦なし）
            </div>
        </div>

        <div class="graph-container">
            <canvas id="graphCanvas" width="450" height="200"></canvas>
        </div>
    </div>

    <script>
        // キャンバス設定
        const animCanvas = document.getElementById('animCanvas');
        const animCtx = animCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // パラメータ
        let m1 = 2.0;          // 振り子の質量
        let m2 = 1.0;          // スライダーの質量
        let L = 0.5;           // 振り子の長さ
        let phi0 = 60;         // 初期角度（度）
        let k = 200;           // ばね定数
        let c = 10;            // 減衰係数
        let e = 0.9;           // 反発係数

        const g = 9.81;

        // 状態変数
        let phi = 0;           // 振り子角度
        let omega = 0;         // 振り子角速度
        let x = 0;             // スライダー変位
        let v = 0;             // スライダー速度
        let t = 0;
        let collisions = 0;
        let paused = false;
        let phase = 'swing';   // 'swing' or 'oscillate'

        // グラフデータ
        let history = [];
        const maxHistory = 500;

        // 位置定数
        const pivotX = 150;
        const pivotY = 80;
        const groundY = 280;
        const scale = 250;

        // UI要素
        document.getElementById('mass1').addEventListener('input', (ev) => {
            m1 = parseFloat(ev.target.value);
            document.getElementById('mass1Value').textContent = m1.toFixed(1) + ' kg';
        });

        document.getElementById('mass2').addEventListener('input', (ev) => {
            m2 = parseFloat(ev.target.value);
            document.getElementById('mass2Value').textContent = m2.toFixed(1) + ' kg';
        });

        document.getElementById('length').addEventListener('input', (ev) => {
            L = parseFloat(ev.target.value);
            document.getElementById('lengthValue').textContent = L.toFixed(2) + ' m';
            reset();
        });

        document.getElementById('initAngle').addEventListener('input', (ev) => {
            phi0 = parseFloat(ev.target.value);
            document.getElementById('initAngleValue').textContent = phi0 + '°';
        });

        document.getElementById('spring').addEventListener('input', (ev) => {
            k = parseFloat(ev.target.value);
            document.getElementById('springValue').textContent = k.toFixed(0) + ' N/m';
        });

        document.getElementById('damping').addEventListener('input', (ev) => {
            c = parseFloat(ev.target.value);
            document.getElementById('dampingValue').textContent = c.toFixed(0) + ' Ns/m';
        });

        document.getElementById('restitution').addEventListener('input', (ev) => {
            e = parseFloat(ev.target.value);
            document.getElementById('restitutionValue').textContent = e.toFixed(2);
        });

        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('pauseBtn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? '再開' : '一時停止';
        });

        function reset() {
            phi = phi0 * Math.PI / 180;
            omega = 0;
            x = 0;
            v = 0;
            t = 0;
            collisions = 0;
            phase = 'swing';
            history = [];
            paused = false;
            document.getElementById('pauseBtn').textContent = '一時停止';
        }

        function simulate(dt) {
            if (phase === 'swing') {
                // 振り子の運動
                const alpha = -(g / L) * Math.sin(phi);
                omega += alpha * dt;
                phi += omega * dt;

                // 衝突判定（振り子が最下点付近で m₂ に衝突）
                // 衝突位置は phi ≈ 0 で m₁ が地面レベルにある時
                const m1Y = pivotY + L * scale * Math.cos(phi);
                const m1X = pivotX + L * scale * Math.sin(phi);

                if (phi <= 0.05 && omega < 0) {
                    // 衝突！
                    const v1_before = -L * omega;  // m₁の水平速度（右向き正）
                    const v2_before = v;

                    // 衝突後の速度（運動量保存 + 反発係数）
                    const v1_after = ((m1 - e * m2) * v1_before + (1 + e) * m2 * v2_before) / (m1 + m2);
                    const v2_after = ((m2 - e * m1) * v2_before + (1 + e) * m1 * v1_before) / (m1 + m2);

                    omega = -v1_after / L;
                    v = v2_after;

                    collisions++;
                    phase = 'oscillate';
                }
            } else {
                // 振り子も続けて動く
                const alpha = -(g / L) * Math.sin(phi);
                omega += alpha * dt;
                phi += omega * dt;

                // スライダーのばね-ダンパ運動
                const a = (-k * x - c * v) / m2;
                v += a * dt;
                x += v * dt;

                // 再衝突判定
                const m1X = L * Math.sin(phi);
                if (m1X >= x && omega < 0) {
                    // 再衝突
                    const v1_before = -L * omega * Math.cos(phi);
                    const v2_before = v;

                    const v1_after = ((m1 - e * m2) * v1_before + (1 + e) * m2 * v2_before) / (m1 + m2);
                    const v2_after = ((m2 - e * m1) * v2_before + (1 + e) * m1 * v1_before) / (m1 + m2);

                    omega = -v1_after / (L * Math.cos(phi) + 0.001);
                    v = v2_after;

                    collisions++;
                }

                // 振り子の跳ね返り制限
                if (phi > phi0 * Math.PI / 180) {
                    phi = phi0 * Math.PI / 180;
                    omega = -omega * 0.5;
                }
            }

            t += dt;

            // 履歴保存
            history.push({ t: t, phi: phi, x: x });
            if (history.length > maxHistory) history.shift();

            // 統計更新
            document.getElementById('stats').innerHTML =
                `振り子角度: ${(phi * 180 / Math.PI).toFixed(1)}°<br>` +
                `スライダー変位: ${x.toFixed(3)} m<br>` +
                `衝突回数: ${collisions}`;
        }

        function drawSpring(x1, y1, x2, y2, coils) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 10) return;

            const ux = dx / len;
            const uy = dy / len;
            const px = -uy;
            const py = ux;

            const coilWidth = 8;
            const endLen = 10;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            animCtx.lineTo(x1 + ux * endLen, y1 + uy * endLen);

            const coilLen = (len - 2 * endLen) / coils;
            for (let i = 0; i < coils; i++) {
                const startX = x1 + ux * (endLen + i * coilLen);
                const startY = y1 + uy * (endLen + i * coilLen);

                animCtx.lineTo(startX + ux * coilLen * 0.25 + px * coilWidth,
                              startY + uy * coilLen * 0.25 + py * coilWidth);
                animCtx.lineTo(startX + ux * coilLen * 0.75 - px * coilWidth,
                              startY + uy * coilLen * 0.75 - py * coilWidth);
            }

            animCtx.lineTo(x2 - ux * endLen, y2 - uy * endLen);
            animCtx.lineTo(x2, y2);
            animCtx.stroke();
        }

        function drawDamper(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 30) return;

            const ux = dx / len;
            const uy = dy / len;
            const px = -uy;
            const py = ux;

            const boxWidth = 10;
            const boxLen = 15;

            animCtx.beginPath();
            animCtx.moveTo(x1, y1);
            const midX = (x1 + x2) / 2 - ux * boxLen / 2;
            const midY = (y1 + y2) / 2 - uy * boxLen / 2;
            animCtx.lineTo(midX, midY);
            animCtx.stroke();

            animCtx.save();
            animCtx.translate(midX, midY);
            animCtx.rotate(Math.atan2(dy, dx));
            animCtx.strokeRect(-2, -boxWidth / 2, boxLen, boxWidth);
            animCtx.restore();

            animCtx.beginPath();
            animCtx.moveTo(x2, y2);
            animCtx.lineTo(midX + ux * boxLen, midY + uy * boxLen);
            animCtx.stroke();
        }

        function draw() {
            animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);

            // 地面
            animCtx.fillStyle = '#eee';
            animCtx.fillRect(0, groundY, animCanvas.width, 30);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.strokeRect(0, groundY, animCanvas.width, 30);

            // ハッチング
            for (let i = 0; i < 28; i++) {
                animCtx.beginPath();
                animCtx.moveTo(10 + i * 20, groundY + 30);
                animCtx.lineTo(i * 20, groundY + 40);
                animCtx.stroke();
            }

            // ピボット（三角形の支持）
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.beginPath();
            animCtx.moveTo(pivotX - 15, pivotY - 20);
            animCtx.lineTo(pivotX + 15, pivotY - 20);
            animCtx.lineTo(pivotX, pivotY);
            animCtx.closePath();
            animCtx.stroke();

            // ピボット点
            animCtx.fillStyle = '#fff';
            animCtx.beginPath();
            animCtx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
            animCtx.fill();
            animCtx.stroke();

            // 振り子の質点位置
            const m1X = pivotX + L * scale * Math.sin(phi);
            const m1Y = pivotY + L * scale * Math.cos(phi);

            // 振り子の棒
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 3;
            animCtx.beginPath();
            animCtx.moveTo(pivotX, pivotY);
            animCtx.lineTo(m1X, m1Y);
            animCtx.stroke();

            // 質点 m₁
            animCtx.fillStyle = '#000';
            animCtx.beginPath();
            animCtx.arc(m1X, m1Y, 12, 0, Math.PI * 2);
            animCtx.fill();

            // 初期位置の点線
            animCtx.strokeStyle = '#aaa';
            animCtx.lineWidth = 1;
            animCtx.setLineDash([5, 5]);
            const initX = pivotX + L * scale * Math.sin(phi0 * Math.PI / 180);
            const initY = pivotY + L * scale * Math.cos(phi0 * Math.PI / 180);
            animCtx.beginPath();
            animCtx.moveTo(pivotX, pivotY);
            animCtx.lineTo(initX, initY);
            animCtx.stroke();
            animCtx.setLineDash([]);

            // 衝突点 B
            const collisionX = pivotX;
            const collisionY = groundY;

            // 壁
            const wallX = animCanvas.width - 40;
            animCtx.fillStyle = '#ddd';
            animCtx.fillRect(wallX, groundY - 80, 30, 80);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1;
            animCtx.strokeRect(wallX, groundY - 80, 30, 80);

            // 壁ハッチング
            for (let i = 0; i < 8; i++) {
                animCtx.beginPath();
                animCtx.moveTo(wallX, groundY - 75 + i * 10);
                animCtx.lineTo(wallX - 10, groundY - 65 + i * 10);
                animCtx.stroke();
            }

            // スライダー m₂
            const sliderX = collisionX + 80 + x * scale;
            const sliderY = groundY - 25;
            const sliderW = 60;
            const sliderH = 25;

            animCtx.fillStyle = '#ccc';
            animCtx.fillRect(sliderX - sliderW/2, sliderY - sliderH/2, sliderW, sliderH);
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.strokeRect(sliderX - sliderW/2, sliderY - sliderH/2, sliderW, sliderH);

            // ばねとダンパ
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            drawSpring(sliderX + sliderW/2, sliderY - 8, wallX, sliderY - 8, 6);
            drawDamper(sliderX + sliderW/2, sliderY + 8, wallX, sliderY + 8);

            // ラベル
            animCtx.fillStyle = '#000';
            animCtx.font = '14px Arial';
            animCtx.textAlign = 'center';

            animCtx.fillText('m₁', m1X + 20, m1Y);
            animCtx.fillText('m₂', sliderX, sliderY + 5);

            // 角度表示
            animCtx.strokeStyle = '#666';
            animCtx.lineWidth = 1;
            animCtx.beginPath();
            animCtx.moveTo(pivotX, pivotY);
            animCtx.lineTo(pivotX, pivotY + 50);
            animCtx.stroke();
            animCtx.beginPath();
            animCtx.arc(pivotX, pivotY, 35, Math.PI/2 - phi, Math.PI/2, phi > 0);
            animCtx.stroke();
            animCtx.fillText('φ₀', pivotX - 50, pivotY + 40);

            // 変位表示
            if (Math.abs(x) > 0.001) {
                animCtx.strokeStyle = '#666';
                animCtx.beginPath();
                animCtx.moveTo(collisionX + 80, sliderY - sliderH/2 - 15);
                animCtx.lineTo(sliderX, sliderY - sliderH/2 - 15);
                animCtx.stroke();
                animCtx.fillText('x', (collisionX + 80 + sliderX) / 2, sliderY - sliderH/2 - 25);
            }

            // ポイントラベル
            animCtx.font = '12px Arial';
            animCtx.beginPath();
            animCtx.arc(pivotX, pivotY, 10, 0, Math.PI * 2);
            animCtx.stroke();
            animCtx.fillText('A', pivotX + 15, pivotY - 10);

            animCtx.beginPath();
            animCtx.arc(collisionX, collisionY, 5, 0, Math.PI * 2);
            animCtx.fill();
            animCtx.fillText('B', collisionX - 15, collisionY + 15);

            animCtx.fillText('C', sliderX + sliderW/2 + 40, sliderY + 20);
            animCtx.fillText('D', wallX - 10, sliderY + 20);

            // 重力
            animCtx.strokeStyle = '#000';
            animCtx.lineWidth = 1.5;
            animCtx.beginPath();
            animCtx.moveTo(300, 50);
            animCtx.lineTo(300, 90);
            animCtx.stroke();
            animCtx.beginPath();
            animCtx.moveTo(295, 85);
            animCtx.lineTo(300, 90);
            animCtx.lineTo(305, 85);
            animCtx.stroke();
            animCtx.font = '14px Arial';
            animCtx.fillText('g', 315, 75);

            // 摩擦係数
            animCtx.font = '12px Arial';
            animCtx.textAlign = 'left';
            animCtx.fillText('μ = 0', 50, groundY + 45);

            // masselos ラベル
            animCtx.fillText('masselos', pivotX - 60, pivotY + L * scale * 0.4);

            // ばね・ダンパラベル
            animCtx.fillText('k', wallX - 40, sliderY - 25);
            animCtx.fillText('c', wallX - 40, sliderY + 25);
        }

        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            // 背景
            graphCtx.fillStyle = '#f9f9f9';
            graphCtx.fillRect(50, 10, 390, 170);

            // 軸
            graphCtx.strokeStyle = '#000';
            graphCtx.lineWidth = 1;
            graphCtx.beginPath();
            graphCtx.moveTo(50, 95);
            graphCtx.lineTo(440, 95);
            graphCtx.stroke();
            graphCtx.beginPath();
            graphCtx.moveTo(50, 10);
            graphCtx.lineTo(50, 180);
            graphCtx.stroke();

            // ラベル
            graphCtx.fillStyle = '#000';
            graphCtx.font = '12px Arial';
            graphCtx.textAlign = 'left';
            graphCtx.fillText('x (m)', 5, 20);
            graphCtx.fillText('t (s)', 415, 195);

            // データプロット
            if (history.length > 1) {
                const tMax = Math.max(history[history.length - 1].t, 5);
                const xMax = 0.1;

                // x（スライダー変位）
                graphCtx.strokeStyle = '#000';
                graphCtx.lineWidth = 1.5;
                graphCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const px = 50 + (history[i].t / tMax) * 390;
                    const py = 95 - (history[i].x / xMax) * 75;
                    if (i === 0) graphCtx.moveTo(px, py);
                    else graphCtx.lineTo(px, py);
                }
                graphCtx.stroke();

                // 凡例
                graphCtx.font = '10px Arial';
                graphCtx.fillStyle = '#000';
                graphCtx.fillRect(380, 15, 20, 2);
                graphCtx.fillText('x', 405, 18);
            }
        }

        // メインループ
        function animate() {
            if (!paused) {
                for (let i = 0; i < 5; i++) {
                    simulate(0.016 / 5);
                }
            }
            draw();
            drawGraph();
            requestAnimationFrame(animate);
        }

        // 初期化
        reset();
        animate();
    </script>
</body>
</html>
